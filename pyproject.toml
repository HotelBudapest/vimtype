[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vimtype-cli"
version = "0.1.0"
description = "A Vim-first terminal typing game inspired by Monkeytype"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND GPL-3.0-only"
license-files = ["LICENSE", "vimtype/data/LICENSE.monkeytype"]
authors = [{name = "Arian Islam"}]
dependencies = []

[project.scripts]
vimtype = "vimtype.app:main"

[tool.setuptools.packages.find]
include = ["vimtype*"]

[tool.setuptools.package-data]
vimtype = ["data/*.json", "data/*.md", "data/LICENSE.monkeytype"]
