[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vimtype-cli"
version = "0.1.0"
description = "A Vim-first terminal typing game inspired by Monkeytype"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Arian Islam"}]
dependencies = []

[project.scripts]
vimtype = "vimtype.app:main"

[tool.setuptools.packages.find]
include = ["vimtype*"]
